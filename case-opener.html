<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Case Opener | The Forces Be With You</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,4 40,24 62,24 44,38 50,60 32,46 14,60 20,38 2,24 24,24' fill='%23ffd54f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="blackhole" aria-hidden="true"></div>
<canvas id="particles-canvas" aria-hidden="true"></canvas>

<header class="topbar">
  <a href="index.html" class="brand">Home</a>
  <div class="topbar-right">
    <nav class="nav-drawer">
      <a href="activity.html">Activity</a>
      <a href="sample.html">Sample Problems</a>
      <a href="credits.html">Credits</a>
      <a href="playground.html">Playground</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<main class="game-page">
  <button id="mute-btn" class="mute-btn" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path class="wave wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path class="wave wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      <line class="mute-x mute-x-1" x1="23" y1="9" x2="17" y2="15"></line>
      <line class="mute-x mute-x-2" x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>
  <h1>Star Case Opener</h1>
  <p class="muted">Open cases to collect real stars. Higher tier stars are rarer.</p>

  <div class="case-controls">
    <button id="open-btn" class="primary" type="button">Open Case</button>
    <button id="skip-btn" class="ghost hidden" type="button">Skip Animation</button>
  </div>

  <div id="reel-viewport" class="reel-viewport">
    <div id="reel-track" class="reel-track"></div>
    <div class="reel-centerline"></div>
  </div>

  <div id="result-panel" class="result-panel hidden"></div>

  <section class="pedia-section">
    <h2>Pedia</h2>
    <p id="pedia-count" class="muted"></p>
    <div id="pedia-grid" class="pedia-grid"></div>
  </section>

  <div class="actions">
    <a href="playground.html" class="ghost">Back to Playground</a>
  </div>
</main>

<script src="js/nav.js" defer></script>
<script type="module" src="js/games/case-opener.js"></script>
<script src="js/particles.js" defer></script>
</body>
</html>
